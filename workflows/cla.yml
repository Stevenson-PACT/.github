name: "CLA Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]
  # Allows this workflow to be called centrally by other org repos or rulesets
  workflow_call:
    secrets:
      PERSONAL_ACCESS_TOKEN:
        required: false
        description: "PAT with access to store signatures if using a private Gist or repo"

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  CLA:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target' || github.event_name == 'workflow_call'
        uses: contributor-assistant/github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.CLA_SIGNATURES_PAT }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          empty-commit-fields: true
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-pr-comment: 'All contributors have signed the CLA.'
          path-to-document: 'https://gist.github.com/jhmanson/f6d60665a816bc62e28e5e6111484987'
          branch: 'main'
